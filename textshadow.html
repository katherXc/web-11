<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>textshadow.html</title>
  <style>
    h3 {
      margin: 10px;
      font-size: 20px;
    }

    .a {
      text-shadow: red -1em -5px 10px;
    }

    .b {
      text-shadow: green -0.3em -0.3em 0.2em;
    }

    .c {
      text-shadow: #00000066 -2px -2px 2px;
    }
  </style>
</head>
<body>
  <h3>textshadow.html</h3>

  <p class="a">每一天都是一個新的開始，努力讓自己變得更好。</p>
  <p class="b">追隨夢想，不忘初心。</p>
  <p class="c">給自己一個目標，去追求，去實現。</p>
</body>
</html>
