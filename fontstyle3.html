<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>fontstyle3.html</title>
  <style>
    h3 {
      margin: 10px;
      font-size: 20px;
    }

    .a {
      text-emphasis: filled red;
    }

    .b {
      text-emphasis-style: filled;
      text-emphasis-color: red;
    }

    .c {
      text-emphasis: open orange;
    }

    .d {
      text-emphasis: triangle #9097d3;
    }

    .e {
      text-emphasis: "哈" lch(50% 50 180 / 0.6);
    }
  </style>
</head>
<body>
  <h3>fontstyle3.html</h3>
  <p class="a">Nice Weather!!</p>
  <p class="b">Nice Weather!!</p>
  <p class="c">Nice Weather!!</p>
  <p class="d">Nice Weather!!</p>
  <p class="e">Nice Weather!!</p>
</body>
</html>
