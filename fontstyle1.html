<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>文字樣式練習</title>
  <style>
    h3 {
      margin: 5px;
      color: rgb(127, 185, 255);
    }

    .a {
      font-style: normal;
    }

    .b {
      font-style: italic;
    }

    .c {
      font-style: oblique;
    }

    .d {
      font-style: normal;
      transform: skewX(60deg);
      display: inline-block;
    }
  </style>
</head>
<body>
  <h3>文字樣式練習 fontstyle1.html</h3>
  <p class="a">這是 normal 字型</p>
  <p class="b">這是 italic 字型</p>
  <p class="c">這是 oblique 字型</p>
  <p class="d">oblique 60 度效果</p>
</body>
</html>
